<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot nalozi</title>
<style>
    :root {
        --bg: #0f1416;
        --panel: #161d20;
        --panel-2: #1d262a;
        --line: #263136;
        --text: #e7f0f2;
        --muted: #7f9298;
        --accent: #3ddc97;
        --danger: #e05a5a;
        --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        height: 100%;
    }
    body { min-height: 100vh; }

    /* ====== Tanka gornja traka ====== */
    .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        width: 100%;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
    }
    h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.2px; }
    h1 span { color: var(--accent); }
    .sub { color: var(--muted); font-size: 11px; }
    .topbar-left { display: flex; align-items: baseline; gap: 10px; }
    .topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tbtn {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--text);
        font-size: 11.5px;
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
        white-space: nowrap;
    }
    .tbtn:hover { border-color: var(--accent); color: var(--accent); }

    /* ====== Mreža botova ("kockice") - ivica do ivice, ređa se levo-desno, red po red ====== */
    .tiles-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 1px;
        background: var(--line);
        width: 100%;
    }
    .tile {
        position: relative;
        background: var(--bg);
        padding: 10px 12px;
        min-height: 96px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 6px;
    }
    .tile:hover { background: var(--panel); }
    .tile-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
    .dot.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .tile-count { font-size: 10px; color: var(--muted); white-space: nowrap; }
    .tile-nick {
        background: transparent;
        border: 1px solid transparent;
        color: var(--text);
        font-size: 13.5px;
        font-weight: 600;
        padding: 2px 4px;
        border-radius: 5px;
        width: 100%;
        min-width: 0;
    }
    .tile-nick:hover { border-color: var(--line); }
    .tile-nick:focus { outline: none; border-color: var(--accent); background: var(--panel-2); }
    .tile-user { color: var(--muted); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tile-ai {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 10.5px;
        color: var(--muted);
        cursor: pointer;
        user-select: none;
    }
    .tile-ai input { margin: 0; cursor: pointer; accent-color: var(--accent); }
    .tile-ai.on { color: var(--text); }
    .tile-remove {
        position: absolute;
        top: 6px; right: 6px;
        background: transparent;
        border: none;
        color: var(--muted);
        width: 20px; height: 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        opacity: 0;
        transition: opacity .1s;
    }
    .tile:hover .tile-remove { opacity: 1; }
    .tile-remove:hover { color: var(--danger); }
    .empty-tiles { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 40px 20px; font-size: 13.5px; background: var(--bg); }

    /* ====== Plutajuća dugmad (dole desno) ====== */
    .fabs { position: fixed; right: 22px; bottom: 22px; display: flex; flex-direction: column; gap: 12px; z-index: 5; }
    .fab {
        width: 52px; height: 52px;
        border-radius: 50%;
        background: var(--accent);
        color: #08110d;
        font-size: 24px;
        border: none;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(61, 220, 151, 0.32);
        transition: transform .15s ease;
        display: flex; align-items: center; justify-content: center;
    }
    .fab:hover { transform: scale(1.06); }
    .fab.secondary { background: var(--panel-2); color: var(--accent); border: 1px solid var(--line); font-size: 21px; }

    /* ====== Generički overlay/modal ====== */
    .overlay {
        position: fixed; inset: 0;
        background: rgba(5, 8, 9, 0.65);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 10;
    }
    .overlay.show { display: flex; }
    .modal {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 24px;
        width: 100%;
        max-width: 380px;
    }
    .modal h2 { margin: 0 0 4px; font-size: 17px; }
    .modal .hint { color: var(--muted); font-size: 12.5px; margin-bottom: 18px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .field input {
        width: 100%;
        background: var(--panel-2);
        border: 1px solid var(--line);
        color: var(--text);
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 14px;
    }
    .field input:focus { outline: none; border-color: var(--accent); }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .btn {
        flex: 1;
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--text);
        font-size: 14px;
        cursor: pointer;
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #08110d; font-weight: 600; }
    .btn:hover { filter: brightness(1.08); }
    .error { color: var(--danger); font-size: 12.5px; margin-top: 10px; min-height: 14px; }

    /* ====== Popup sa porukama (lista botova + editor za izabranog) ====== */
    .msg-modal {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        width: 100%;
        max-width: 780px;
        max-height: 82vh;
        display: flex;
        overflow: hidden;
    }
    .msg-modal-list {
        width: 220px;
        flex: none;
        border-right: 1px solid var(--line);
        background: var(--panel-2);
        overflow-y: auto;
    }
    .msg-modal-head {
        padding: 14px 16px 10px;
        border-bottom: 1px solid var(--line);
    }
    .msg-modal-head h2 { margin: 0; font-size: 15.5px; }
    .msg-modal-head .hint { color: var(--muted); font-size: 11.5px; margin-top: 3px; }
    .bot-list-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        cursor: pointer;
        font-size: 13px;
        border-bottom: 1px solid var(--line);
    }
    .bot-list-item:hover { background: var(--panel); }
    .bot-list-item.active { background: var(--accent-dim, #1a3d2f); color: var(--accent); font-weight: 600; }
    .bot-list-item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bot-list-item .cnt { font-size: 10.5px; color: var(--muted); }
    .bot-list-empty { color: var(--muted); font-size: 12.5px; padding: 16px; }

    .msg-modal-right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .msg-modal-close {
        position: absolute;
        top: 12px; right: 12px;
        background: transparent;
        border: none;
        color: var(--muted);
        font-size: 20px;
        cursor: pointer;
        width: 30px; height: 30px;
        border-radius: 7px;
    }
    .msg-modal-close:hover { color: var(--text); background: var(--panel-2); }
    .msg-editor-head { padding: 14px 18px 10px; border-bottom: 1px solid var(--line); position: relative; }
    .msg-editor-head h3 { margin: 0; font-size: 14.5px; }
    .msg-editor-head .hint { color: var(--muted); font-size: 11.5px; margin-top: 3px; }
    .msg-rows { flex: 1; overflow-y: auto; padding: 10px 18px; }
    .msg-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 0;
        border-bottom: 1px solid var(--line);
    }
    .msg-row .row-text {
        flex: 1;
        min-width: 0;
        background: var(--bg);
        border: 1px solid var(--line);
        color: var(--text);
        padding: 7px 9px;
        border-radius: 7px;
        font-size: 13px;
    }
    .msg-row .row-seconds {
        width: 66px;
        background: var(--bg);
        border: 1px solid var(--line);
        color: var(--text);
        padding: 7px 6px;
        border-radius: 7px;
        font-size: 13px;
        text-align: center;
        flex: none;
    }
    .msg-row .sec-label { font-size: 10.5px; color: var(--muted); flex: none; }
    .msg-row .row-text:focus, .msg-row .row-seconds:focus { outline: none; border-color: var(--accent); }
    .msg-row .row-remove {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--muted);
        width: 24px; height: 24px;
        border-radius: 6px;
        cursor: pointer;
        flex: none;
        font-size: 13px;
    }
    .msg-row .row-remove:hover { border-color: var(--danger); color: var(--danger); }
    .msg-editor-empty { color: var(--muted); text-align: center; padding: 30px 0; font-size: 12.5px; }
    .msg-editor-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 18px;
        border-top: 1px solid var(--line);
        flex-wrap: wrap;
    }
    .add-row-btn {
        background: transparent;
        border: 1px dashed var(--line);
        color: var(--muted);
        padding: 7px 11px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 12px;
    }
    .add-row-btn:hover { border-color: var(--accent); color: var(--accent); }
    .save-btn {
        padding: 8px 15px;
        border-radius: 7px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #08110d;
        font-weight: 600;
        font-size: 12px;
        cursor: pointer;
    }
    .save-btn:hover { filter: brightness(1.08); }
    .save-btn:disabled { opacity: 0.6; cursor: default; }
    .save-status { font-size: 11px; color: var(--muted); width: 100%; order: 3; }
    .save-status.ok { color: var(--accent); }
    .save-status.err { color: var(--danger); }
    .msg-pick-hint { color: var(--muted); font-size: 13px; text-align: center; padding: 40px 20px; }

    @media (max-width: 640px) {
        .msg-modal { flex-direction: column; max-height: 88vh; }
        .msg-modal-list { width: 100%; max-height: 140px; border-right: none; border-bottom: 1px solid var(--line); }
    }
</style>
</head>
<body>

<div class="topbar">
    <div class="topbar-left">
        <h1>Bot <span>nalozi</span></h1>
        <div class="sub" id="subtitle">Učitavanje...</div>
    </div>
    <div class="topbar-actions">
        <button class="tbtn" id="exportJson" type="button">⬇ Sačuvaj JSON</button>
        <button class="tbtn" id="importJsonBtn" type="button">⬆ Učitaj JSON</button>
        <input type="file" id="importJsonFile" accept="application/json" style="display:none">
    </div>
</div>

<div class="tiles-grid" id="tilesGrid"></div>

<div class="fabs">
    <button class="fab secondary" id="openMessages" title="Poruke">✉</button>
    <button class="fab" id="openAdd" title="Dodaj nalog">+</button>
</div>

<!-- Modal: dodaj nalog -->
<div class="overlay" id="overlay">
    <div class="modal">
        <h2>Dodaj nalog</h2>
        <div class="hint">Unesi xat korisničko ime i API ključ. Nadimak u chatu je podrazumevano isti kao korisničko ime.</div>

        <div class="field">
            <label>Korisničko ime</label>
            <input id="fUsername" type="text" placeholder="npr. AngelDobric" autocomplete="off">
        </div>
        <div class="field">
            <label>API ključ</label>
            <input id="fApikey" type="text" placeholder="API ključ naloga" autocomplete="off">
        </div>
        <div class="field">
            <label>Nadimak u chatu (opciono)</label>
            <input id="fNickname" type="text" placeholder="Podrazumevano = korisničko ime" autocomplete="off">
        </div>

        <div class="error" id="formError"></div>

        <div class="modal-actions">
            <button class="btn" id="cancelAdd">Otkaži</button>
            <button class="btn primary" id="confirmAdd">Dodaj</button>
        </div>
    </div>
</div>

<!-- Popup: poruke (lista botova + editor za izabranog) -->
<div class="overlay" id="msgOverlay">
    <div class="msg-modal">
        <div class="msg-modal-list">
            <div class="msg-modal-head">
                <h2>Poruke</h2>
                <div class="hint">Izaberi bota</div>
            </div>
            <div id="botList"></div>
        </div>
        <div class="msg-modal-right">
            <button class="msg-modal-close" id="closeMessages" title="Zatvori">×</button>
            <div id="msgEditorArea" style="display:flex; flex-direction:column; flex:1; min-height:0;">
                <div class="msg-pick-hint">Izaberi bota sa liste levo da urediš njegove poruke.</div>
            </div>
        </div>
    </div>
</div>

<script>
    let ADMIN_TOKEN = sessionStorage.getItem('adminToken') || '';
    let currentAccounts = [];
    let isEditing = false;
    let selectedBotId = null;

    function headers (json = true) {
        const h = {};
        if (json) h['Content-Type'] = 'application/json';
        if (ADMIN_TOKEN) h['x-admin-token'] = ADMIN_TOKEN;
        return h;
    }

    async function api (url, options = {}) {
        const res = await fetch(url, { ...options, headers: { ...headers(!!options.body), ...(options.headers || {}) } });
        if (res.status === 401) {
            const token = prompt('Unesi pristupni kod za admin panel:');
            if (token) {
                ADMIN_TOKEN = token;
                sessionStorage.setItem('adminToken', token);
                return api(url, options);
            }
            throw new Error('Neautorizovan pristup.');
        }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Greška.');
        return data;
    }

    function escapeHtml (s) {
        return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    const tilesGrid = document.getElementById('tilesGrid');
    const subtitle = document.getElementById('subtitle');
    const botList = document.getElementById('botList');
    const msgEditorArea = document.getElementById('msgEditorArea');

    /* ================= Mreža botova (kockice, ivica do ivice) ================= */

    function renderTiles (accounts) {
        if (accounts.length === 0) {
            tilesGrid.innerHTML = '<div class="empty-tiles">Nema dodatih naloga. Klikni + da dodaš prvi.</div>';
            return;
        }
        tilesGrid.innerHTML = accounts.map((a) => {
            const count = Array.isArray(a.messages) ? a.messages.length : 0;
            return `
            <div class="tile" data-id="${a.id}">
                <button class="tile-remove" title="Ukloni nalog">×</button>
                <div class="tile-top">
                    <span class="dot ${a.connected ? 'on' : ''}"></span>
                    <span class="tile-count">${count} por.</span>
                </div>
                <input class="tile-nick" value="${escapeHtml(a.nickname)}" data-original="${escapeHtml(a.nickname)}" spellcheck="false">
                <div class="tile-user">@${escapeHtml(a.username)}</div>
                <label class="tile-ai ${a.aiEnabled ? 'on' : ''}">
                    <input type="checkbox" class="tile-ai-checkbox" ${a.aiEnabled ? 'checked' : ''}>
                    AI
                </label>
            </div>`;
        }).join('');
    }

    tilesGrid.addEventListener('click', async (e) => {
        const tile = e.target.closest('.tile');
        if (!tile) return;
        const id = tile.dataset.id;

        if (e.target.classList.contains('tile-remove')) {
            if (!confirm('Ukloniti ovaj nalog? Bot će odmah izaći iz chata.')) return;
            try {
                await api(`/api/accounts/${id}`, { method: 'DELETE' });
                load();
            } catch (err) {
                alert(err.message);
            }
        }
    });

    tilesGrid.addEventListener('change', async (e) => {
        if (!e.target.classList.contains('tile-ai-checkbox')) return;
        const checkbox = e.target;
        const tile = checkbox.closest('.tile');
        const id = tile.dataset.id;
        const aiEnabled = checkbox.checked;

        try {
            await api(`/api/accounts/${id}`, {
                method: 'PATCH',
                body: JSON.stringify({ aiEnabled }),
            });
            checkbox.closest('.tile-ai').classList.toggle('on', aiEnabled);
            const acc = currentAccounts.find((a) => String(a.id) === String(id));
            if (acc) acc.aiEnabled = aiEnabled;
        } catch (err) {
            checkbox.checked = !aiEnabled;
            alert(err.message);
        }
    });

    tilesGrid.addEventListener('keydown', (e) => {
        if (e.target.classList.contains('tile-nick') && e.key === 'Enter') e.target.blur();
    });

    tilesGrid.addEventListener('blur', async (e) => {
        if (!e.target.classList.contains('tile-nick')) return;
        const input = e.target;
        const value = input.value.trim();
        const original = input.dataset.original;
        if (!value || value === original) { input.value = original; return; }

        const id = input.closest('.tile').dataset.id;
        try {
            const updated = await api(`/api/accounts/${id}`, {
                method: 'PATCH',
                body: JSON.stringify({ nickname: value }),
            });
            input.dataset.original = updated.nickname;
            const acc = currentAccounts.find((a) => String(a.id) === String(id));
            if (acc) acc.nickname = updated.nickname;
        } catch (err) {
            alert(err.message);
            input.value = original;
        }
    }, true);

    /* ================= Popup sa porukama ================= */

    const msgOverlay = document.getElementById('msgOverlay');
    const openMessagesBtn = document.getElementById('openMessages');
    const closeMessagesBtn = document.getElementById('closeMessages');

    openMessagesBtn.addEventListener('click', () => {
        if (msgOverlay.classList.contains('show')) {
            msgOverlay.classList.remove('show');
            return;
        }
        renderBotList();
        if (selectedBotId == null && currentAccounts.length) selectedBotId = currentAccounts[0].id;
        renderMsgEditor();
        msgOverlay.classList.add('show');
    });
    closeMessagesBtn.addEventListener('click', () => msgOverlay.classList.remove('show'));
    msgOverlay.addEventListener('click', (e) => { if (e.target === msgOverlay) msgOverlay.classList.remove('show'); });

    function renderBotList () {
        if (!currentAccounts.length) {
            botList.innerHTML = '<div class="bot-list-empty">Nema dodatih naloga.</div>';
            return;
        }
        botList.innerHTML = currentAccounts.map((a) => {
            const count = Array.isArray(a.messages) ? a.messages.length : 0;
            return `
            <div class="bot-list-item ${String(a.id) === String(selectedBotId) ? 'active' : ''}" data-id="${a.id}">
                <span class="dot ${a.connected ? 'on' : ''}"></span>
                <span class="name">${escapeHtml(a.nickname || a.username)}</span>
                <span class="cnt">${count}</span>
            </div>`;
        }).join('');
    }

    botList.addEventListener('click', (e) => {
        const item = e.target.closest('.bot-list-item');
        if (!item) return;
        selectedBotId = item.dataset.id;
        renderBotList();
        renderMsgEditor();
    });

    function msgRowHtml (text, delaySeconds) {
        return `
        <div class="msg-row">
            <input class="row-text" value="${escapeHtml(text || '')}" placeholder="Tekst poruke...">
            <span class="sec-label">sek nakon prethodne</span>
            <input class="row-seconds" type="number" min="1" step="1" value="${Number(delaySeconds) > 0 ? Number(delaySeconds) : 60}">
            <button class="row-remove" title="Ukloni">×</button>
        </div>`;
    }

    function renderMsgEditor () {
        const bot = currentAccounts.find((a) => String(a.id) === String(selectedBotId));
        if (!bot) {
            msgEditorArea.innerHTML = '<div class="msg-pick-hint">Izaberi bota sa liste levo da urediš njegove poruke.</div>';
            return;
        }
        const messages = Array.isArray(bot.messages) ? bot.messages : [];
        const rowsHtml = messages.length
            ? messages.map((m) => msgRowHtml(m.text, m.delaySeconds)).join('')
            : '<div class="msg-editor-empty">Nema poruka za ovog bota. Dodaj red ispod.</div>';

        msgEditorArea.innerHTML = `
            <div class="msg-editor-head">
                <h3>${escapeHtml(bot.nickname || bot.username)}</h3>
                <div class="hint">Poruka → koliko sekundi čeka nakon SVOJE prethodne poruke na chatu pre nego što pošalje baš ovu.</div>
            </div>
            <div class="msg-rows" id="msgRows">${rowsHtml}</div>
            <div class="msg-editor-footer">
                <button class="add-row-btn" id="addMsgRow" type="button">+ Dodaj poruku</button>
                <button class="save-btn" id="saveBotMsgs" type="button">Sačuvaj poruke</button>
                <div class="save-status" id="msgSaveStatus"></div>
            </div>
        `;

        document.getElementById('addMsgRow').addEventListener('click', () => {
            const rowsEl = document.getElementById('msgRows');
            const empty = rowsEl.querySelector('.msg-editor-empty');
            if (empty) rowsEl.innerHTML = '';
            rowsEl.insertAdjacentHTML('beforeend', msgRowHtml('', 60));
            const rows = rowsEl.querySelectorAll('.msg-row');
            rows[rows.length - 1].querySelector('.row-text').focus();
        });

        document.getElementById('msgRows').addEventListener('click', (e) => {
            if (!e.target.classList.contains('row-remove')) return;
            e.target.closest('.msg-row').remove();
            const rowsEl = document.getElementById('msgRows');
            if (!rowsEl.querySelector('.msg-row')) {
                rowsEl.innerHTML = '<div class="msg-editor-empty">Nema poruka za ovog bota. Dodaj red ispod.</div>';
            }
        });

        document.getElementById('saveBotMsgs').addEventListener('click', async () => {
            const btn = document.getElementById('saveBotMsgs');
            const status = document.getElementById('msgSaveStatus');
            status.textContent = '';
            status.className = 'save-status';

            const messages = [];
            document.querySelectorAll('#msgRows .msg-row').forEach((row) => {
                const text = row.querySelector('.row-text').value.trim();
                const delaySeconds = Number(row.querySelector('.row-seconds').value) || 60;
                if (text) messages.push({ text, delaySeconds });
            });

            btn.disabled = true;
            try {
                await api(`/api/accounts/${bot.id}`, {
                    method: 'PATCH',
                    body: JSON.stringify({ messages }),
                });
                bot.messages = messages;
                status.textContent = 'Sačuvano.';
                status.className = 'save-status ok';
                renderBotList();
                renderTiles(currentAccounts);
            } catch (err) {
                status.textContent = err.message;
                status.className = 'save-status err';
            } finally {
                btn.disabled = false;
            }
        });
    }

    // Ne diramo ekran/popup dok korisnik nešto kuca.
    document.addEventListener('focusin', (e) => {
        if (e.target.matches('input, textarea, select')) isEditing = true;
    });
    document.addEventListener('focusout', () => {
        setTimeout(() => {
            if (!document.activeElement || !document.activeElement.matches('input, textarea, select')) isEditing = false;
        }, 50);
    });

    /* ================= JSON export / import (backup na uređaju) ================= */

    // Napomena: API ključevi se iz bezbednosnih razloga NE vraćaju sa
    // servera (/api/accounts ih ne otkriva), pa ni JSON backup fajl ne sadrži
    // API ključeve - samo korisnička imena, nadimke i poruke. Zato "Učitaj
    // JSON" može da AŽURIRA već postojeće naloge (poklapanje po korisničkom
    // imenu), ali ne može sâm da napravi potpuno nov nalog bez ključa.
    document.getElementById('exportJson').addEventListener('click', () => {
        const data = currentAccounts.map((a) => ({
            username: a.username,
            nickname: a.nickname,
            messages: (a.messages || []).map((m) => ({ text: m.text, delaySeconds: m.delaySeconds })),
        }));
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `obicnixat-nalozi-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
    });

    const importInput = document.getElementById('importJsonFile');
    document.getElementById('importJsonBtn').addEventListener('click', () => importInput.click());

    importInput.addEventListener('change', async () => {
        const file = importInput.files[0];
        importInput.value = '';
        if (!file) return;

        let parsed;
        try {
            parsed = JSON.parse(await file.text());
        } catch {
            alert('Fajl nije validan JSON.');
            return;
        }
        if (!Array.isArray(parsed)) {
            alert('JSON fajl mora biti niz naloga.');
            return;
        }

        const existingByUsername = new Map(currentAccounts.map((a) => [a.username, a]));
        let updated = 0, skipped = 0, failed = 0;

        for (const entry of parsed) {
            const username = String(entry?.username || '').trim();
            if (!username) continue;
            const messages = Array.isArray(entry.messages)
                ? entry.messages.map((m) => ({ text: String(m.text || ''), delaySeconds: Number(m.delaySeconds) || 60 }))
                : [];
            const nickname = String(entry.nickname || username).trim();
            const existing = existingByUsername.get(username);

            // Ključevi naloga se ne čuvaju u JSON backup-u (server ih ne
            // vraća), pa fajl može samo da AŽURIRA već postojeće naloge -
            // nov nalog i dalje treba dodati ručno preko + dugmeta.
            if (!existing) { skipped++; continue; }

            try {
                await api(`/api/accounts/${existing.id}`, {
                    method: 'PATCH',
                    body: JSON.stringify({ nickname, messages }),
                });
                updated++;
            } catch {
                failed++;
            }
        }

        alert(`Učitano iz JSON fajla: ${updated} ažuriranih${skipped ? `, ${skipped} preskočeno (nalog ne postoji, dodaj ga ručno preko +)` : ''}${failed ? `, ${failed} nije uspelo` : ''}.`);
        load();
    });

    /* ================= Učitavanje / osvežavanje ================= */

    function render (accounts) {
        currentAccounts = accounts;
        renderTiles(accounts);
        subtitle.textContent = `${accounts.length} ${accounts.length === 1 ? 'nalog' : 'naloga'} · svi u istom chatu`;
    }

    async function load () {
        // Ne diramo DOM (ni glavni ekran ni popup sa porukama) dok korisnik
        // nešto kuca - pre je auto-refresh brisao ono što još nije sačuvano.
        if (isEditing) return;
        try {
            const accounts = await api('/api/accounts');
            render(accounts);
        } catch (e) {
            subtitle.textContent = e.message;
        }
    }

    /* ================= Modal za dodavanje naloga ================= */

    const overlay = document.getElementById('overlay');
    const openAdd = document.getElementById('openAdd');
    const cancelAdd = document.getElementById('cancelAdd');
    const confirmAdd = document.getElementById('confirmAdd');
    const formError = document.getElementById('formError');

    openAdd.addEventListener('click', () => {
        document.getElementById('fUsername').value = '';
        document.getElementById('fApikey').value = '';
        document.getElementById('fNickname').value = '';
        formError.textContent = '';
        overlay.classList.add('show');
        document.getElementById('fUsername').focus();
    });
    cancelAdd.addEventListener('click', () => overlay.classList.remove('show'));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('show'); });

    confirmAdd.addEventListener('click', async () => {
        const username = document.getElementById('fUsername').value.trim();
        const apikey = document.getElementById('fApikey').value.trim();
        const nickname = document.getElementById('fNickname').value.trim();

        if (!username || !apikey) {
            formError.textContent = 'Korisničko ime i API ključ su obavezni.';
            return;
        }

        confirmAdd.disabled = true;
        try {
            await api('/api/accounts', { method: 'POST', body: JSON.stringify({ username, apikey, nickname }) });
            overlay.classList.remove('show');
            load();
        } catch (err) {
            formError.textContent = err.message;
        } finally {
            confirmAdd.disabled = false;
        }
    });

    load();
    setInterval(load, 8000);
</script>
</body>
</html>
